<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AutoServe — Print</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          obsidian: '#0B0E14',
          panel: '#0F1218',
          panel2: '#13171F',
          line: 'rgba(255,255,255,0.08)',
          line2: 'rgba(255,255,255,0.14)',
          ink: '#fafafa',
          silver: '#94A3B8',
          mute: '#5B6473',
          teal: '#10B981',
          tealDim: '#0e7d5b',
          warn: '#eab308',
          danger: '#ef4444',
          info: '#3b82f6',
        },
        fontFamily: {
          sans: ['Geist', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          mono: ['Geist Mono', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
        },
        boxShadow: {
          float: '0 1px 3px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.06)',
        },
        borderRadius: {
          'xs': '2px',
        }
      }
    }
  }
</script>
<style>
  html, body { background: #0B0E14; color: #fafafa; }
  body { font-family: 'Geist', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .scroll-thin::-webkit-scrollbar { width: 8px; height: 8px; }
  .scroll-thin::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 0; }
  .scroll-thin::-webkit-scrollbar-track { background: transparent; }
  .grid-bg {
    background-image:
      linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  @keyframes sk {
    0% { background-position: -200px 0; }
    100% { background-position: calc(200px + 100%) 0; }
  }
  .sk {
    background: linear-gradient(90deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.10) 50%, rgba(255,255,255,0.04) 100%);
    background-size: 200px 100%;
    background-repeat: no-repeat;
    animation: sk 1.4s ease-in-out infinite;
  }
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }
  .live-dot { animation: pulse-dot 1.6s ease-in-out infinite; }
  .tnum { font-variant-numeric: tabular-nums; }
  @keyframes spark { from { stroke-dashoffset: 600; } to { stroke-dashoffset: 0; } }
  .spark path { stroke-dasharray: 600; animation: spark 1.6s ease-out forwards; }
  .focus-ring:focus { outline: none; box-shadow: inset 0 0 0 1px #10B981; }
  .row-hover:hover { background: rgba(255,255,255,0.03); }
  .stripe {
    background-image: repeating-linear-gradient(135deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 8px);
  }
  ::selection { background: #10B981; color: #0B0E14; }

  /* ============================================
     Print-specific styles
     ============================================ */
  .print-shell { width: 1500px; margin: 0 auto; padding: 24px 24px 32px; }

  .role-page { padding-top: 8px; }
  .role-page + .role-page { padding-top: 28px; }
  .role-page-header {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.10);
  }
  .role-page-header h1 {
    font-size: 28px; font-weight: 500; letter-spacing: -0.01em;
  }
  .role-page-header .meta { font-size: 13px; color: #94A3B8; }
  .role-page-header .crest {
    display:flex; align-items:center; gap:10px;
  }
  .role-page-header .crest-mark {
    width: 22px; height: 22px; border: 1px solid rgba(16,185,129,0.7); border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
  }
  .role-page-header .crest-mark span { width: 9px; height: 9px; background: #10B981; border-radius: 1px; }

  @media print {
    @page { size: 1500px 2000px; margin: 24px; }
    html, body {
      background: #0B0E14 !important;
      color: #fafafa !important;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    .print-shell { width: 100%; padding: 0; margin: 0; }
    .role-page { break-before: page; padding-top: 0; }
    .role-page:first-child { break-before: auto; }
    .role-page + .role-page { padding-top: 0; }
    /* Avoid splitting panels across pages where possible */
    section[class*="border"][class*="bg-panel"],
    .panel-keep, ul, table { break-inside: avoid; }
    /* Stop infinite animations from looking smeared */
    .sk, .live-dot, .spark path { animation: none !important; }
    /* Hide the activity feed scroll cap so all rows render */
    .scroll-thin { max-height: none !important; overflow: visible !important; }
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="bg-obsidian text-ink min-h-screen">
<div id="root"></div>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="customer.jsx"></script>
<script type="text/babel" src="manager.jsx"></script>
<script type="text/babel" src="mechanic.jsx"></script>
<script type="text/babel" src="admin.jsx"></script>
<script type="text/babel">
  const PAGES = [
    { id: 'customer', label: 'Customer',  meta: 'Marcus Holloway · CU-44193',           Comp: window.CustomerDashboard },
    { id: 'manager',  label: 'Manager',   meta: 'Priya Chandrasekaran · SF-MISSION-01', Comp: window.ManagerDashboard  },
    { id: 'mechanic', label: 'Mechanic',  meta: 'Diego Marquez · ASE Master · L1',      Comp: window.MechanicDashboard },
    { id: 'admin',    label: 'Admin',     meta: 'Yuki Tanaka · West region',            Comp: window.AdminDashboard    },
  ];

  function PrintShell() {
    return (
      <div className="print-shell">
        {PAGES.map(p => (
          <section className="role-page" key={p.id}>
            <header className="role-page-header">
              <div className="crest">
                <div className="crest-mark"><span /></div>
                <div>
                  <div style={{fontSize: 11, color: '#5B6473', letterSpacing: '0.04em'}}>AutoServe</div>
                  <h1>{p.label} workspace</h1>
                </div>
              </div>
              <div className="meta">{p.meta}</div>
            </header>
            <p.Comp pushToast={() => {}} />
          </section>
        ))}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<PrintShell />);

  // Auto-print after fonts + skeleton timers + safety buffer
  (async () => {
    try {
      if (document.fonts && document.fonts.ready) {
        await document.fonts.ready;
      }
    } catch (e) { /* ignore */ }
    // dashboard skeletons clear after up to ~700ms; allow buffer for layout + babel
    await new Promise(r => setTimeout(r, 2200));
    window.print();
  })();
</script>
</body>
</html>
